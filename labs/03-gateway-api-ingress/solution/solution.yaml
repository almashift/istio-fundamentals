apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: meshmart-gateway
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
spec:
  parentRefs:
    - name: meshmart-gateway
  hostnames: [shop.meshmart.local]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - name: orders
          port: 80
    - backendRefs:
        - name: web
          port: 80
