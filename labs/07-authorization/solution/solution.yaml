apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: catalog-web-get-only
spec:
  selector:
    matchLabels:
      app: catalog
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/meshmart/sa/web"]
      to:
        - operation:
            methods: ["GET"]
