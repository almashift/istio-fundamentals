kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Fixed API port so the kubeconfig stays valid after the Codespace restarts.
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
nodes:
  - role: control-plane
    # Reserved for gateway labs: expose NodePorts 30080/30443 as 8080/8443.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
