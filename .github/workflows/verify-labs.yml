name: verify-labs

# Every lab must satisfy two rules, enforced here on a real kind cluster:
#   1. its STARTING state FAILS the checker
#   2. its reference SOLUTION PASSES the checker
# Run it on every push and whenever you bump versions.env.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # Syntax errors show up as annotations on the run, readable without opening the logs.
      - name: Check MeshMart compiles
        run: python3 -m py_compile meshmart/app/app.py

      - name: Install kind, istioctl, lab CLI
        run: bash setup/install-tools.sh

      - name: Create cluster and install Istio
        run: bash setup/ensure-cluster.sh

      # Labs use the image tag pinned in versions.env. Building it here and loading it into
      # kind tests this commit's MeshMart without publishing anything.
      - name: Build MeshMart image and load it into kind
        run: |
          source versions.env
          docker build -t "$MESHMART_IMAGE" meshmart/app
          kind load docker-image "$MESHMART_IMAGE" --name "$CLUSTER_NAME"

      - name: Verify every lab
        run: |
          set -o pipefail
          bash bin/lab verify 2>&1 | tee verify.log

      - name: Debug info on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl -n meshmart describe pods || true
          kubectl -n istio-system logs deploy/istiod --tail=100 || true

      # Job logs need a GitHub login to read; annotations don't. Publish the end of the
      # verify output and the pod states as one annotation so failures are visible to all.
      - name: Summarise failure as an annotation
        if: failure()
        run: |
          {
            tail -80 verify.log 2>/dev/null || true
            echo "--- pods"; kubectl get pods -A 2>&1 | tail -30 || true
          } | sed 's/\x1b\[[0-9;]*m//g' > summary.txt
          body="$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' summary.txt)"
          echo "::error title=lab verify failed::${body}"
