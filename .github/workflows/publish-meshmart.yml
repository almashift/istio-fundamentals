name: publish-meshmart

# Publishes the MeshMart image students pull, at the tag pinned in versions.env
# (MESHMART_IMAGE). Runs when the app or the pinned tag changes on master.
# Bump the tag in versions.env for every app change, so published tags never move.
on:
  push:
    branches: [master]
    paths: ["meshmart/app/**", "versions.env", ".github/workflows/publish-meshmart.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the pinned image tag
        id: tag
        run: |
          source versions.env
          echo "image=$MESHMART_IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 for Codespaces, Killercoda and CI; arm64 for ARM machines.
      - uses: docker/build-push-action@v6
        with:
          context: meshmart/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=MeshMart, the example store for AlmaShift's Istio labs
